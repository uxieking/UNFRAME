<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNFRAME — LENSVRA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <!-- 1. Opening screen -->
    <section id="screen-opening" class="screen screen-opening">
      <p class="brand">LENSVRA</p>
      <h1 class="title">UNFRAME</h1>
      <p id="opening-text" class="lead"></p>
      <button id="start-button" class="button button-primary" type="button"></button>
    </section>

    <!-- 2. Clip screen: one player, reused for the three lens clips and the normal clip -->
    <section id="screen-clip" class="screen screen-clip" hidden>
      <div class="player">
        <video id="clip-video" playsinline preload="auto"></video>
        <canvas id="effects-layer" class="effects-layer" aria-hidden="true"></canvas>
        <p id="sound-reminder" class="player-note sound-reminder" hidden></p>
        <p id="clip-error" class="player-note clip-error" hidden></p>
      </div>

      <div id="question-panel" class="question" hidden>
        <p id="question-text" class="question-text"></p>
        <div id="choices" class="choices"></div>
        <div class="question-actions">
          <button id="replay-button" class="button button-ghost" type="button"></button>
          <button id="skip-button" class="button button-ghost" type="button"></button>
        </div>
      </div>

      <!-- Only after the normal clip: no question, no text, just a way on -->
      <button id="continue-button" class="button button-primary appear" type="button" hidden></button>
    </section>

    <!-- 3. Reveal screen: all four clips, the viewer's answers, the closing question -->
    <section id="screen-reveal" class="screen screen-reveal" hidden>
      <div id="reveal-grid" class="reveal-grid"></div>
      <p id="takes-note" class="takes-note" hidden></p>
      <p id="closing-question" class="closing-question"></p>
      <button id="restart-button" class="button button-ghost restart" type="button"></button>
    </section>

  </main>
  <script src="effects.js"></script>
  <script src="script.js"></script>
</body>
</html>
